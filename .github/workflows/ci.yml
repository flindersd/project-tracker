name: ci

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm install
      - run: npm run lint --workspace @initiative-tracker/web
      - run: npm run test --workspace @initiative-tracker/web
      - run: npm run build --workspace @initiative-tracker/web

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore src/api/ProjectTracker.Api.sln
      - run: dotnet format --verify-no-changes --no-restore src/api/ProjectTracker.Api.sln
      - run: dotnet test src/api/ProjectTracker.Api.sln --no-restore
      - run: dotnet build src/api/ProjectTracker.Api.sln --no-restore
